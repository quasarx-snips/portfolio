<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- soft coral -> dusty rose wash, the hero's ambient light -->
    <radialGradient id="blobA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97d76" stop-opacity="0.55" />
      <stop offset="55%" stop-color="#eba39c" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#2b1517" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blobB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f3d1cc" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#2b1517" stop-opacity="0" />
    </radialGradient>
    <!-- the wobble that makes it read as an organic blob, not a circle -->
    <filter id="warp" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="3" seed="7" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="170" xChannelSelector="R" yChannelSelector="G" />
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <g filter="url(#warp)">
    <ellipse cx="400" cy="360" rx="330" ry="290" fill="url(#blobA)" />
    <ellipse cx="540" cy="470" rx="230" ry="200" fill="url(#blobB)" />
    <ellipse cx="270" cy="250" rx="180" ry="170" fill="url(#blobB)" />
  </g>
</svg>
