<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07060a" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="The Palace of Many Worlds — an opening cinematic by Bibhab. Somewhere between what is known and what is yet to be imagined."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      imagesrcset="/world/temple-dark-1280.webp 1280w, /world/temple-dark-2000.webp 2000w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <script>
      // Provisional tier before CSS runs, so old phones never paint the full
      // effect stack for a frame. The perf layer refines it after a GPU probe.
      (function () {
        var mem = navigator.deviceMemory || 8;
        var cores = navigator.hardwareConcurrency || 8;
        var conn = navigator.connection || {};
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var tier =
          mem <= 3 || cores <= 3
            ? 'low'
            : mem <= 4 || cores <= 4 || conn.saveData || coarse
              ? 'mid'
              : 'high';
        var root = document.documentElement;
        root.classList.add('tier-' + tier);
        if (tier !== 'high' || conn.saveData) root.classList.add('low-power');
        root.dataset.tier = tier;
        root.style.backgroundColor = '#07060a';
      })();
    </script>
    <title>Bibhab — The Palace of Many Worlds</title>
    <style>
      html,
      body {
        margin: 0;
        background: #07060a;
      }
      /* First paint, before any bundle: the same dark room the boot screen
         lives in, one hairline breathing. React replaces this node. */
      .boot-shell {
        position: fixed;
        inset: 0;
        z-index: 95;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 26px;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background:
          radial-gradient(120% 90% at 50% 38%, #121016 0%, #07060a 58%, #04040a 100%);
        color: #ece0cc;
        font-family: Georgia, 'Times New Roman', serif;
        text-align: center;
      }
      .boot-shell__kicker {
        margin: 0;
        font-size: 0.64rem;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #b9a892;
      }
      .boot-shell__bar {
        width: min(220px, 46vw);
        height: 1px;
        overflow: hidden;
        background: rgba(201, 160, 106, 0.18);
      }
      .boot-shell__bar span {
        display: block;
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #c9a06a, transparent);
        animation: boot-shell-sweep 1.4s ease-in-out infinite;
      }
      .boot-shell__label {
        margin: 0;
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        color: rgba(236, 224, 204, 0.62);
      }
      @keyframes boot-shell-sweep {
        from { transform: translateX(-110%); }
        to { transform: translateX(360%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-shell__bar span { animation: none; width: 100%; opacity: 0.5; }
      }
      .noscript {
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 0.35rem;
        padding: 48px 24px;
        background: #07060a;
        color: #ece0cc;
        font-family: Georgia, serif;
        text-align: center;
      }
      .noscript h1 { font-weight: 300; font-size: clamp(3rem, 10vw, 7rem); margin: 0.1em 0 0.4em; }
      .noscript p { margin: 0; line-height: 1.7; }
      .noscript .kicker { letter-spacing: 0.3em; font-size: 0.7rem; color: #b9a892; text-transform: uppercase; }
      .noscript .note { margin-top: 2.4rem; font-size: 0.85rem; color: #8d8378; }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#after-opening">Skip the opening</a>
    <div id="root">
      <div class="boot-shell" role="status" aria-live="polite">
        <p class="boot-shell__kicker">The Palace of Many Worlds</p>
        <div class="boot-shell__bar" aria-hidden="true"><span></span></div>
        <p class="boot-shell__label">Opening the palace</p>
      </div>
    </div>
    <noscript>
      <div class="noscript">
        <p class="kicker">The Palace of Many Worlds</p>
        <h1>Bibhab</h1>
        <p lang="hi">बिभव</p>
        <p lang="bn">বিভব</p>
        <p>An explorer of ideas, systems and possibilities.</p>
        <p class="note">The opening cinematic needs JavaScript enabled.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
